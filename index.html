<!DOCTYPE html>
<html>
<head>
<title>17 and one for luck</title>

<style>

body{
margin:0;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at top,#223d6d 0%,#081120 45%),
linear-gradient(to bottom,#081120,#152643);
font-family:Georgia,serif;
position:relative;
}

.title{
position:absolute;
top:50px;
width:100%;
text-align:center;
font-size:42px;
color:#f7f2eb;
letter-spacing:2px;
z-index:5;
}

.subtitle{
position:absolute;
top:110px;
width:100%;
text-align:center;
color:#cfd6e2;
z-index:5;
}

.moon{
position:absolute;
top:70px;
right:120px;
width:110px;
height:110px;
border-radius:50%;
background:#f6efd8;
box-shadow:0 0 60px rgba(255,255,220,.6);
}

.cloud1{
position:absolute;
bottom:70px;
left:-100px;
width:500px;
height:150px;
background:white;
opacity:.06;
filter:blur(50px);
border-radius:50%;
}

.cloud2{
position:absolute;
bottom:120px;
right:-100px;
width:400px;
height:120px;
background:white;
opacity:.05;
filter:blur(45px);
border-radius:50%;
}
.purpleGlow{
position:absolute;
top:150px;
left:20%;
width:500px;
height:300px;
background:#7b5cff;
opacity:.08;
filter:blur(100px);
border-radius:50%;
}

.pinkGlow{
position:absolute;
bottom:50px;
right:15%;
width:400px;
height:250px;
background:#ffb3d9;
opacity:.05;
filter:blur(100px);
border-radius:50%;
}

.sparkle{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:.6;
animation:twinkle 3s infinite alternate;
}
.memoryStar{
position:absolute;
width:20px;
height:20px;
background:#fff7d6;
clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
box-shadow:0 0 20px #fff7d6;
cursor:pointer;
}

#popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
z-index:100;
}

#note{
background:#ffd6ec;
color:#3a3552;
padding:25px;
width:300px;
min-height:180px;
border-radius:14px;
box-shadow:0 0 30px rgba(255,255,255,.15);
position:relative;
font-size:18px;
line-height:1.5;
}

#closeBtn{
position:absolute;
top:10px;
right:14px;
border:none;
background:none;
font-size:24px;
cursor:pointer;
color:#555;
}

.memoryStar:hover{
transform:scale(1.3);
transition:.3s;
}

.visited{
opacity:.5;
}

#luckyStar{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:50px;
display:none;
cursor:pointer;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2;}
to{opacity:1;}
}

</style>
</head>

<body>

<div class="moon"></div>

<div class="cloud1"></div>
<div class="cloud2"></div>

<div class="title">17 and one for luck</div>

<div class="subtitle">
click a star when you're ready
</div>

<div class="sparkle" style="top:15%;left:10%;"></div>
<div class="sparkle" style="top:20%;left:20%;"></div>
<div class="sparkle" style="top:30%;left:35%;"></div>
<div class="sparkle" style="top:12%;left:50%;"></div>
<div class="sparkle" style="top:25%;left:70%;"></div>
<div class="sparkle" style="top:18%;left:85%;"></div>
<div class="sparkle" style="top:40%;left:15%;"></div>
<div class="sparkle" style="top:50%;left:28%;"></div>
<div class="sparkle" style="top:45%;left:65%;"></div>
<div class="sparkle" style="top:35%;left:82%;"></div>
<div class="sparkle" style="top:55%;left:90%;"></div>
<div class="sparkle" style="top:65%;left:22%;"></div>


<!-- MEMORY STARS -->

<div class="memoryStar" style="top:22%;left:18%;" data-memory="Memory 1"></div>
<div class="memoryStar" style="top:30%;left:35%;" data-memory="Memory 2"></div>
<div class="memoryStar" style="top:20%;left:50%;" data-memory="Memory 3"></div>
<div class="memoryStar" style="top:28%;left:65%;" data-memory="Memory 4"></div>
<div class="memoryStar" style="top:40%;left:80%;" data-memory="Memory 5"></div>
<div class="memoryStar" style="top:50%;left:20%;" data-memory="Memory 6"></div>
<div class="memoryStar" style="top:60%;left:35%;" data-memory="Memory 7"></div>
<div class="memoryStar" style="top:48%;left:50%;" data-memory="Memory 8"></div>
<div class="memoryStar" style="top:58%;left:65%;" data-memory="Memory 9"></div>
<div class="memoryStar" style="top:68%;left:78%;" data-memory="Memory 10"></div>
<div class="memoryStar" style="top:72%;left:15%;" data-memory="Memory 11"></div>
<div class="memoryStar" style="top:75%;left:28%;" data-memory="Memory 12"></div>
<div class="memoryStar" style="top:70%;left:45%;" data-memory="Memory 13"></div>
<div class="memoryStar" style="top:78%;left:58%;" data-memory="Memory 14"></div>
<div class="memoryStar" style="top:74%;left:72%;" data-memory="Memory 15"></div>
<div class="memoryStar" style="top:35%;left:10%;" data-memory="Memory 16"></div>
<div class="memoryStar" style="top:15%;left:75%;" data-memory="Memory 17"></div>
<div id="luckyStar">⭐</div>
<div id="popup"> 
  <div id="note"> 
    <button id="closeBtn">×</button>
    <p id="memoryText"></p>
  </div>
</div>

<script>

const stars = document.querySelectorAll(".memoryStar");
const popup = document.getElementById("popup");
const memoryText = document.getElementById("memoryText");
const closeBtn = document.getElementById("closeBtn");
const luckyStar = document.getElementById("luckyStar");

let opened = 0;

stars.forEach(star => {

  star.addEventListener("click", () => {

    if(!star.classList.contains("visited")){
      star.classList.add("visited");
      opened++;
    }

    memoryText.textContent = star.dataset.memory;

    popup.style.display = "flex";

    if(opened === 17){
      luckyStar.style.display = "block";
    }

  });

});

closeBtn.addEventListener("click", () => {
  popup.style.display = "none";
});

luckyStar.addEventListener("click", () => {

  memoryText.innerHTML =
  "⭐ You've unlocked the lucky star!";

  popup.style.display = "flex";

});

</script>

</body>
</html>
