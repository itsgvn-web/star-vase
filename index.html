<!DOCTYPE html>
<html>
<head>
<title>17 and one for luck</title>

<style>

body{
margin:0;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at top,#223d6d 0%,#081120 45%),
linear-gradient(to bottom,#081120,#152643);
font-family:Georgia,serif;
position:relative;
}

.title{
position:absolute;
top:50px;
width:100%;
text-align:center;
font-size:42px;
color:#f7f2eb;
letter-spacing:2px;
z-index:5;
}

.subtitle{
position:absolute;
top:110px;
width:100%;
text-align:center;
color:#cfd6e2;
z-index:5;
}

.moon{
position:absolute;
top:70px;
right:120px;
width:110px;
height:110px;
border-radius:50%;
background:#f6efd8;
box-shadow:0 0 60px rgba(255,255,220,.6);
}

.cloud1{
position:absolute;
bottom:70px;
left:-100px;
width:500px;
height:150px;
background:white;
opacity:.06;
filter:blur(50px);
border-radius:50%;
}

.cloud2{
position:absolute;
bottom:120px;
right:-100px;
width:400px;
height:120px;
background:white;
opacity:.05;
filter:blur(45px);
border-radius:50%;
}
.purpleGlow{
position:absolute;
top:150px;
left:20%;
width:500px;
height:300px;
background:#7b5cff;
opacity:.08;
filter:blur(100px);
border-radius:50%;
}

.pinkGlow{
position:absolute;
bottom:50px;
right:15%;
width:400px;
height:250px;
background:#ffb3d9;
opacity:.05;
filter:blur(100px);
border-radius:50%;
}

.sparkle{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:.6;
animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2;}
to{opacity:1;}
}

</style>
</head>

<body>

<div class="moon"></div>

<div class="cloud1"></div>
<div class="cloud2"></div>

<div class="title">17 and One for Luck</div>

<div class="subtitle">
click a star when you're ready
</div>

<div class="sparkle" style="top:15%;left:10%;"></div>
<div class="sparkle" style="top:20%;left:20%;"></div>
<div class="sparkle" style="top:30%;left:35%;"></div>
<div class="sparkle" style="top:12%;left:50%;"></div>
<div class="sparkle" style="top:25%;left:70%;"></div>
<div class="sparkle" style="top:18%;left:85%;"></div>
<div class="sparkle" style="top:40%;left:15%;"></div>
<div class="sparkle" style="top:50%;left:28%;"></div>
<div class="sparkle" style="top:45%;left:65%;"></div>
<div class="sparkle" style="top:35%;left:82%;"></div>
<div class="sparkle" style="top:55%;left:90%;"></div>
<div class="sparkle" style="top:65%;left:22%;"></div>

</body>
</html>
