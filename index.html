<!DOCTYPE html>
<html>
<head>
<title>17 and one for luck</title>


<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: 
        radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.15) 0%, transparent 60%),
        radial-gradient(circle at top, #1e1b4b 0%, #030712 70%),
        linear-gradient(to bottom, #030712, #0f172a);
    font-family: Georgia, serif;
    position: relative;
}

.title {
    font-family: 'Cinzel Decorative', Georgia, serif;
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, rgba(254, 240, 138, 0.9) 0%, rgba(216, 180, 254, 0.85) 50%, rgba(192, 132, 252, 0.75) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(216, 180, 254, 0.4);
    opacity: 0.92;
    margin-top: 40px;
    margin-bottom: 5px;
    text-align: center;
    position: relative;
    z-index: 5;
}

.subtitle {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    color: rgba(233, 213, 255, 0.75);
    text-shadow: 0 0 10px rgba(216, 180, 254, 0.3);
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 5;
}

.moon {
    position: absolute;
    top: 30px;
    right: 50px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(216, 180, 254, 0.45) 60%, rgba(147, 51, 234, 0.15) 100%);
    box-shadow: 
        0 0 40px rgba(216, 180, 254, 0.35),
        inset -20px -20px 30px rgba(88, 28, 135, 0.4);
    opacity: 0.9;
    filter: drop-shadow(0 0 25px rgba(254, 240, 138, 0.25));
    animation: moonFloat 6s ease-in-out infinite alternate;
    z-index: 2;
    pointer-events: none;
}
    @keyframes moonFloat {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-12px);
    }
}
.cloud1 {
    position: absolute;
    bottom: 70px;
    left: -100px;
    width: 500px;
    height: 150px;
    background: white;
    opacity: .06;
    filter: blur(50px);
    border-radius: 50%;
}

.cloud2 {
    position: absolute;
    bottom: 120px;
    right: -100px;
    width: 400px;
    height: 120px;
    background: white;
    opacity: .05;
    filter: blur(45px);
    border-radius: 50%;
}
.nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
    animation: nebulaDrift 10s ease-in-out infinite alternate;
}

/* Purple Nebula */
.nebula-purple {
    top: 20%;
    left: 15%;
    width: 400px;
    height: 300px;
    background: radial-gradient(circle, #8b5cf6, transparent 70%);
}

/* Cyan/Blue Nebula */
.nebula-blue {
    bottom: 15%;
    right: 10%;
    width: 450px;
    height: 350px;
    background: radial-gradient(circle, #06b6d4, transparent 70%);
}

/* Pink/Magenta Nebula */
.nebula-pink {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, #ec4899, transparent 70%);
    opacity: 0.25;
}

@keyframes nebulaDrift {
    from {
        transform: scale(1) translate(0, 0);
    }
    to {
        transform: scale(1.1) translate(15px, -15px);
    }
}

.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: radial-gradient(circle, #ffffff 0%, #fef08a 100%);
    border-radius: 50%;
    opacity: 0.6;
    box-shadow: 0 0 8px rgba(254, 240, 138, 0.6), 0 0 3px rgba(255, 255, 255, 0.8);
    animation: twinkle 3s infinite alternate;
    z-index: 1;
    pointer-events: none;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.8);
    }
    to {
        opacity: 0.8;
        transform: scale(1.3);
    }
}

.memoryStar {
    position: absolute;
    width: 34px;
    height: 34px;
    background: #fff7d6;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    box-shadow: 0 0 15px #fff7d6;
    cursor: pointer;
    transition: transform .3s, opacity .3s;
    z-index: 50;
    touch-action: manipulation;
}

.memoryStar:hover {
    transform: scale(1.4);
}
#luckyStar {
    position: absolute;
    border-radius: 50%;
    border: 3px solid rgba(254, 240, 138, 1);
    box-shadow: 
        0 0 35px rgba(254, 240, 138, 1),
        0 0 70px rgba(253, 224, 71, 0.9),
        0 0 120px rgba(234, 179, 8, 0.8),
        0 0 180px rgba(202, 138, 4, 0.5);
    filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.8));
    animation: goldShimmer 1.8s ease-in-out infinite alternate;
}

@keyframes goldShimmer {
    0% {
        box-shadow: 
            0 0 20px rgba(254, 240, 138, 0.8),
            0 0 45px rgba(253, 224, 71, 0.7),
            0 0 80px rgba(234, 179, 8, 0.5);
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
        transform: scale(1);
    }
    100% {
        box-shadow: 
            0 0 45px rgba(255, 255, 255, 1),
            0 0 90px rgba(254, 240, 138, 1),
            0 0 150px rgba(253, 224, 71, 0.95),
            0 0 220px rgba(234, 179, 8, 0.7);
        filter: drop-shadow(0 0 40px rgba(254, 240, 138, 0.9));
        transform: scale(1.3);
    }
}
.visited {
    opacity: .35;
    filter: grayscale(40%);
}

/* Translucent Pastel Sticky Notes */
/* Translucent Pastel Sticky Notes */
#popup {
    display: none; /* Keeps it hidden by default */
    background: rgba(255, 245, 248, 0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 
        0 8px 32px 0 rgba(147, 51, 234, 0.2),
        inset 0 0 15px rgba(255, 255, 255, 0.2);
    color: #fdf4ff;
    font-family: Georgia, serif;
    font-size: 1.1rem;
    line-height: 1.6;
    max-width: 320px;
    text-align: center;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
}

#popup.active {
    display: block;
}

/* Optional: Rotate sticky colors dynamically using nth-child */
.popup:nth-child(2n) {
    background: rgba(243, 232, 255, 0.25); /* Translucent pastel lavender */
    box-shadow: 0 8px 32px 0 rgba(168, 85, 247, 0.25);
}

.popup:nth-child(3n) {
    background: rgba(224, 242, 254, 0.25); /* Translucent pastel sky */
    box-shadow: 0 8px 32px 0 rgba(56, 189, 248, 0.25);
}

.popup:nth-child(5n) {
    background: rgba(254, 240, 138, 0.2); /* Translucent pastel yellow */
    box-shadow: 0 8px 32px 0 rgba(250, 204, 21, 0.2);
}

#note {
    background: #ffd6ec;
    color: #3a3552;
    padding: 30px 25px 25px 25px;
    width: 300px;
    min-height: 180px;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    position: relative;
    font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    transform: rotate(-2deg);
}

#note.color-1 { background: #ffb7b2; } 
#note.color-2 { background: #ffdac1; } 
#note.color-3 { background: #e2f0cb; } 
#note.color-4 { background: #b5ead7; } 
#note.color-5 { background: #c7ceea; } 

#closeBtn {
    position: absolute;
    top: 8px;
    right: 12px;
    border: none;
    background: none;
    font-size: 22px;
    cursor: pointer;
    color: #555;
}

#luckyStar {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 36px;
    height: 36px;
    background: #ffffff;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    box-shadow: 0 0 20px #b19cd9, 0 0 35px rgba(177, 156, 217, 0.8);
    display: none;
    cursor: pointer;
    animation: purpleShimmer 2s infinite alternate;
    z-index: 20;
    transition: transform .3s;
}

#luckyStar:hover {
    transform: translate(-50%, -50%) scale(1.3);
}

@keyframes purpleShimmer {
    from {
        box-shadow: 0 0 15px #b19cd9, 0 0 5px #ffffff;
    }
    to {
        box-shadow: 0 0 30px #d8b4fe, 0 0 15px #ffffff;
    }
}

</style>
</head>

<div id="luckyStar" title="Click your lucky star!"></div>
<!-- FIXED POPUP HTML -->
<div id="popup"> 
  <div id="note" class="color-1"> 
    <button id="closeBtn">×</button>
    <p id="memoryText"></p>
  </div>
</div>

<script>
const stars = document.querySelectorAll(".memoryStar");
const popup = document.getElementById("popup");
const note = document.getElementById("note");
const memoryText = document.getElementById("memoryText");
const closeBtn = document.getElementById("closeBtn");
const luckyStar = document.getElementById("luckyStar");

let opened = 0;

stars.forEach((star, index) => {

    function openMemory(e) {

        e.preventDefault();

        if (!star.classList.contains("visited")) {
            star.classList.add("visited");
            opened++;
        }

        memoryText.textContent = star.dataset.memory;

        const randomRot = (Math.random() * 6) - 3;
        note.style.transform = `rotate(${randomRot}deg)`;

        note.className = "";
        note.classList.add(`color-${(index % 5) + 1}`);

        popup.classList.add("active");

        if (opened === 17) {
            luckyStar.style.display = "block";
        }
    }

    star.addEventListener("click", openMemory);
    star.addEventListener("touchstart", openMemory, { passive: false });

});
closeBtn.addEventListener("click", () => {
    popup.classList.remove("active");
});

popup.addEventListener("click", (e) => {
    if (e.target === popup) {
        popup.classList.remove("active");
    }
});

luckyStar.addEventListener("click", () => {

    memoryText.innerHTML =
        "<strong>✨ The 18th Star Unlocked!</strong><br><br>" +
        "I hope you are not sad on days you don't have to be. " +
        "I hope on days you feel like you have no one, you always have someone to go to. " +
        "I hope you become someone you will be proud of. " +
        "Thank you for being a constant till now and I hope it stays like this for long. " +
        "Happy Birthday Parv. 🤍";

    note.style.transform = "rotate(1deg)";

    note.className = "";
    note.classList.add("color-2");

    popup.classList.add("active");
});
</script>
